name: binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - ".github/workflows/autobot.yml"
      - "AutoBot.yml"
      - "scripts/autobot.py"
  # PR 阶段也要跑：此前只有 push/tag 触发，等于合并前零门禁，坏代码合进 main
  # 才第一次跑 go test。fork PR 拿不到 contents: write，只会构建不会发版。
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 前端不再 go:embed 进二进制：public/ 由 Go 在运行时映射成 /panel/。
      # 所以 CI 必须先构建前端——go test 里的静态资源断言、以及发布 zip 里的
      # public/ 都依赖它，缺了它面板起来就是一段「请先构建前端」的说明页。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build web
        run: |
          set -euo pipefail
          npm ci --prefix web --no-audit --no-fund --registry=https://registry.npmmirror.com
          npm run build --prefix web
          test -f public/index.html

      - name: test
        run: go test ./...

      # 出站头与官方真机夹具对拍（默认跳过，CI 显式开启作门禁）。
      # 夹具是 WorkBuddy 桌面端真机抓包原文；任何头名/值/大小写漂移都会红。
      # 改夹具必须同时说明抓包依据，否则等于自己给自己放水。
      - name: official-head parity
        run: WB2A_PARITY=1 go test ./internal/upstream -run TestOfficialParity -v

      # ponytail: 标签发版用标签名，避免 CI 时钟和标签差一分钟变成两个号。
      - name: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(TZ=Asia/Shanghai date +%Y.%-m.%-d.%-H%M)" >> "$GITHUB_ENV"
          fi

      - name: build
        run: |
          set -euo pipefail
          # ponytail: 包结构跟上游一样；主程序 windows/linux/darwin × amd64/arm64
          # （darwin 是 issue #23 的诉求：M 系列跑 arm64 原生，不套 Docker）。
          mkdir -p dist
          # public/ 是前端产物（vite build 输出），必须随包发布：二进制只带一个
          # 指向 ./public 的映射，压缩包解压到哪、就地运行就吃到哪份前端。
          pack() {
            dir="dist/$1-$2"
            mkdir -p "$dir"
            cp "$3" "$dir/"
            cp config.example.json README.md "$dir/"
            cp -r public "$dir/"
            python3 -c 'import os,sys,zipfile; n,d=sys.argv[1:]; z=zipfile.ZipFile(n,"w",zipfile.ZIP_DEFLATED); [z.write(os.path.join(r,f), os.path.relpath(os.path.join(r,f), d)) for r,_,fs in os.walk(d) for f in fs]; z.close()' \
              "dist/wb2api-panel-${VERSION}-$1-$2.zip" "$dir"
          }
          for os in windows linux darwin; do
            bin=wb2api
            [ "$os" = windows ] && bin=wb2api.exe
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags="-s -w -X main.appVersion=${VERSION}" -o "$bin" ./cmd/server
              pack "$os" "$arch" "$bin"
            done
          done

      # ponytail: 四个 upload，每个系统架构一个 artifact。matrix 等构建时间不够再用。
      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-panel-${{ env.VERSION }}-windows-amd64
          path: dist/windows-amd64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-panel-${{ env.VERSION }}-windows-arm64
          path: dist/windows-arm64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-panel-${{ env.VERSION }}-linux-amd64
          path: dist/linux-amd64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-panel-${{ env.VERSION }}-linux-arm64
          path: dist/linux-arm64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-panel-${{ env.VERSION }}-darwin-amd64
          path: dist/darwin-amd64
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wb2api-panel-${{ env.VERSION }}-darwin-arm64
          path: dist/darwin-arm64
          if-no-files-found: error

      - name: release
        # 只有打 v* 标签才发版。此前 workflow_dispatch 也能走到这里，会基于 main
        # HEAD 隐式建 v* 标签并连带触发镜像发布，绕过「打标签才发版」的约定；
        # dispatch 现在只构建 + 上传 artifact（手动验证用）。
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${VERSION}" dist/*.zip --title "v${VERSION}" --generate-notes
